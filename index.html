<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d14">
  <title>Flores Amarillas • Un regalo especial para ti 🌻</title>

  <!-- Open Graph / WhatsApp Preview Meta -->
  <meta property="og:title" content="Flores Amarillas • Un regalo para ti 🌻">
  <meta property="og:description" content="Aunque estemos lejos, este jardín eterno florece para ti en este 21 de septiembre.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Three.js ES Modules Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- 3D Canvas WebGL Viewport -->
  <div id="canvas-container"></div>

  <!-- Intimate Entrance (Minimalist, quiet, artistic) -->
  <div id="intro-overlay">
    <div class="intro-content">
      <h1 class="intro-heading">¿pensaste que te ibas a quedar sin las tuyas?</h1>
      <div class="intro-touch-area">
        <span class="touch-pulse"></span>
        <span class="touch-label">toca en cualquier parte</span>
        <span class="intro-rotate-tip">↺ se recomienda girar el teléfono en horizontal</span>
      </div>
    </div>
  </div>

  <!-- In-Garden HUD UI (Clean, buttons removed) -->
  <div id="ui-container">
    <div class="rotate-hint">
      <span class="hint-icon">⤾</span>
      <span>gira tu pantalla para la vista completa</span>
    </div>

    <header class="hud-header" style="justify-content: flex-end;">
      <div class="hud-actions">
        <!-- Audio Music Toggle -->
        <button id="audio-toggle" class="circle-btn" title="Francés Limón - Enjambre" aria-label="Música">
          <div class="equalizer-icon">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
        </button>
      </div>
    </header>
  </div>

  <!-- Cinematic Poetry Subtitles (Pure, delicate, floating in air, no boxes) -->
  <div id="cinema-poetry" class="cinema-poetry">
    <span class="poetry-line line-1">te amo</span>
    <span class="poetry-line line-2">y aunque hoy solo sea código,</span>
    <span class="poetry-line line-3">algún día va a ser un jardín.</span>
  </div>

  <!-- App Bootstrap Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
